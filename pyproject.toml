[project]
name = "bundestag-topic-landscape"
version = "0.1.0"
description = "Topic landscape of one Bundestag sitting week: speeches → embeddings → clusters → interactive map"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2",
    "scikit-learn>=1.5",
    "umap-learn>=0.5.7",
    "sentence-transformers>=3",
    "torch>=2.4",
]

[project.scripts]
landscape = "landscape.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landscape"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
