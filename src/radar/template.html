<style>

}
@font-face {
  font-family: Inter; font-style: normal; font-weight: 100 900; font-display: swap;
  src: url(assets/inter-latin.woff2) format("woff2");
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
:root {
  --bg: #f6f6f4; --card: #ffffff; --text: #1f2328; --muted: #6b7280; --faint: #a1a1aa; --line: #e7e7e3;
  /* the Radar colour as this page's accent (shell.css); links to the evidence in Research stay blue (a.ev) */
  --accent: var(--radar, #7c3aed); --accent-soft: var(--radar-soft, #f1ebff); --research: #2563eb;
  --cdu: #2f2f2f; --spd: #d7263d; --afd: #1f8fd6; --gru: #3f9a3f; --lin: #c0397d; --frl: #8a8a8a; --reg: #a08a2e;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13.5px/1.5 Inter, system-ui, -apple-system, sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; }

header { height: 52px; display: flex; align-items: center; gap: 16px; padding: 0 22px; background: var(--card); border-top: 3px solid var(--accent); border-bottom: 1px solid var(--line); }
header .brand + h1 { padding-left: 16px; border-left: 1px solid var(--line); }
a.ev { color: var(--research); }
.whohead h2 a.ev { color: inherit; } .whohead h2 a.ev:hover { color: var(--research); }
header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
header h1 a { color: inherit; }
header .meta { color: var(--muted); font-size: 13px; }
header .spacer { flex: 1; }
.weekwrap { position: relative; }
.weekbtn { white-space: nowrap; font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.weekbtn:hover { border-color: #cdcdc8; background: var(--bg); }
.weekbtn::before { content: ''; width: 11px; height: 11px; border: 1.5px solid var(--muted); border-top-width: 4px; border-radius: 2px; }
#weekCal { position: absolute; left: 0; top: 36px; z-index: 30; display: none; gap: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 12px 14px 10px; }
#weekCal.open { display: flex; }
#weekCal b { display: block; font-size: 12px; margin-bottom: 6px; }
#weekCal .mo { display: flex; gap: 3px; align-items: center; margin-bottom: 3px; }
#weekCal .mo span { width: 30px; font-size: 11px; color: var(--faint); }
#weekCal .wk { width: 26px; height: 22px; line-height: 22px; text-align: center; border-radius: 6px; font-size: 11px; color: #cfcfca; font-variant-numeric: tabular-nums; }
#weekCal .wk.has { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
#weekCal .wk.has:hover { background: var(--accent); color: #fff; text-decoration: none; }
#weekCal .wk.cur { background: var(--accent); color: #fff; }
#dayScale { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 4; display: none; align-items: center; gap: 14px; pointer-events: none;
  background: rgba(255,255,255,.8); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
#dayScale i { display: inline-block; width: 44px; height: 8px; border-radius: 4px; vertical-align: middle; margin-right: 6px; }
#dayScale .hint { color: var(--faint); }
header .help { color: var(--faint); font-size: 12.5px; }

#layout { display: grid; grid-template-columns: 270px 1fr 390px; height: calc(100% - 52px); }
aside, #panel { background: var(--card); overflow-y: auto; }
aside { border-right: 1px solid var(--line); padding: 14px 16px 24px; }
#panel { border-left: 1px solid var(--line); padding: 22px 24px 32px; }
#map { min-width: 0; position: relative; }
#tip { position: absolute; z-index: 5; width: 300px; pointer-events: none; display: none; transform: translate(-50%, -100%);
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px 9px; box-shadow: 0 6px 20px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05); font-size: 12.5px; line-height: 1.45; }
#tip::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 10px; height: 10px; background: var(--card); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: translateX(-50%) rotate(45deg); }
#labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 3; }
.lbl { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer; white-space: nowrap;
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px 3px 7px; border-radius: 999px;
  background: rgba(255,255,255,.72); border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.06);
  font-size: 11.5px; font-weight: 500; color: #374151; letter-spacing: -.005em; transition: transform .15s, box-shadow .15s; }
.lbl .dot { width: 7px; height: 7px; }
.lbl .n { color: var(--faint); font-weight: 400; font-size: 10.5px; }
.lbl:hover { transform: translate(-50%, -50%) scale(1.06); box-shadow: 0 4px 12px rgba(0,0,0,.12); border-color: currentColor; z-index: 4; }
.lbl.zoomed { font-size: 12.5px; padding: 4px 11px 4px 8px; }
#tip.below { transform: translate(-50%, 0); }

/* tours */
.tourbtn { font-size: 12.5px; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 3px 12px; cursor: pointer; }
.tourbtn:hover { border-color: #cdcdc8; background: var(--bg); }
#tourMenu { position: absolute; right: 22px; top: 46px; z-index: 30; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.1); padding: 6px; display: none; }
#tourMenu.open { display: block; }
#tourMenu .t { display: block; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: inherit; }
#tourMenu .t:hover { background: var(--bg); text-decoration: none; }
#tourMenu .t b { display: block; font-weight: 600; font-size: 13px; }
#tourMenu .t span { color: var(--muted); font-size: 12px; }
#tourDim { position: fixed; inset: 0; z-index: 20; background: rgba(15,23,42,.32); pointer-events: none; display: none; }
#tourDim.show { display: block; }
.tour-target { position: relative; z-index: 21; border-radius: 8px; box-shadow: 0 0 0 3px var(--accent), 0 0 0 7px var(--accent-soft); background: var(--card); }
#map.tour-target { border-radius: 0; box-shadow: inset 0 0 0 3px var(--accent); background: transparent; }
#map.tour-keep { position: relative; z-index: 21; }
#tourCard { position: fixed; z-index: 22; width: 320px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.14); padding: 14px 16px 12px; display: none; font-size: 13px; line-height: 1.5; }
#tourCard.show { display: block; }
#tourCard .bar { height: 3px; margin: 0 0 10px; background: var(--line); }
#tourCard .bar i { background: var(--accent); }
#tourCard .step { color: var(--faint); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
#tourCard h4 { margin: 2px 0 6px; font-size: 14px; font-weight: 600; }
#tourCard p { margin: 0 0 10px; color: var(--muted); }
#tourCard p b { color: var(--text); font-weight: 500; }
#tourCard .row { display: flex; gap: 12px; align-items: center; }
#tourCard .row .spacer { flex: 1; }
#tourCard .next { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; }
#tourCard .wait { color: var(--accent); font-size: 12.5px; }
#tourCard.done { border-color: #3f9a3f; box-shadow: 0 0 0 3px #e3f3e3, 0 10px 30px rgba(0,0,0,.14); }
#tourCard.done .wait { color: #3f9a3f; }
#tip.below::after { bottom: auto; top: -6px; transform: translateX(-50%) rotate(-135deg); }
.tipbox .who { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.tipbox .who span { font-weight: 400; color: var(--muted); }
.tipbox .when { color: var(--faint); font-size: 11.5px; margin-bottom: 5px; }
.tipbox .top { color: var(--text); margin-bottom: 1px; }
.tipbox .topic { color: var(--accent); font-size: 11.5px; margin-bottom: 6px; }
.tipbox .excerpt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; mask-image: linear-gradient(#000 45%, transparent 100%); -webkit-mask-image: linear-gradient(#000 45%, transparent 100%); }
#map .cursor-move { cursor: default !important; }  /* Plotly's four-arrow pan cursor */

.sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.sidebar-head b { font-size: 13px; font-weight: 600; }
#count { color: var(--muted); font-size: 12px; }
.linkbtn { font-size: 12.5px; background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; }
.linkbtn:hover { text-decoration: underline; }

.group { border-top: 1px solid var(--line); padding: 8px 0; }
.group .title { display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 3px 0; }
.group .title .arrow { width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--faint); transition: transform .2s; margin-left: auto; }
.group.collapsed .title .arrow { transform: rotate(-90deg); }
.group .title .badge { font-size: 10.5px; font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 6px; }
.group .title .reload { font-size: 13px; color: var(--faint); cursor: pointer; padding: 0 2px; }
.group .title .reload:hover { color: var(--text); }
.group .content { padding-top: 4px; }
.group.collapsed .content { display: none; }
.list { max-height: 264px; overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.item { display: flex; align-items: center; gap: 7px; padding: 3px 4px; border-radius: 6px; cursor: pointer; font-size: 12.5px; line-height: 1.35; }
.item:hover { background: var(--bg); }
.item:hover .name { color: var(--accent); }
.item input { margin: 0; accent-color: var(--accent); flex: none; cursor: pointer; }
.item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .n { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
.item.zero { opacity: .45; }
.item.day { font-weight: 600; margin-top: 6px; }
.item.day:first-child { margin-top: 0; }
.item.day .dot { width: 22px; border-radius: 4px; }
.item:not(.day)[data-key=agenda] { padding-left: 14px; }
.item .x { color: var(--faint); font-size: 14px; line-height: 1; padding: 0 2px; }
.item .x:hover { color: var(--text); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; display: inline-block; }

.searchrow { display: flex; gap: 0; margin-bottom: 6px; }
.searchrow input { flex: 1; min-width: 0; border-radius: 8px 0 0 8px; }
.searchrow button { border: 1px solid var(--line); border-left: 0; background: var(--bg); color: var(--text); border-radius: 0 8px 8px 0; padding: 0 10px; font-size: 12.5px; cursor: pointer; }
.searchrow button:hover { background: #ecece8; }
.segmented { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 3px; background: var(--bg); border-radius: 8px; padding: 3px; margin-bottom: 6px; }
.segmented button { border: 0; background: transparent; border-radius: 6px; padding: 5px 2px; font-size: 12px; color: var(--muted); cursor: pointer; }
.segmented button.on { background: var(--card); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
select, input[type=text] { width: 100%; font: inherit; font-size: 12.5px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
select:focus, input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; cursor: pointer; font-size: 12.5px; }
.toggle input { appearance: none; width: 30px; height: 18px; border-radius: 999px; background: #d9d9d4; position: relative; cursor: pointer; margin: 0; transition: background .15s; flex: none; }
.toggle input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle input:checked { background: var(--accent); }
.toggle input:checked::after { left: 14px; }

#panel .hint { color: var(--muted); }
.fnote { margin: 6px 0 0; color: var(--faint); font-size: 11.5px; line-height: 1.4; }
#panel .hint kbd { font: inherit; font-size: 11.5px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; background: var(--bg); }
#panel h2 { font-size: 16px; font-weight: 600; margin: 0 0 6px; letter-spacing: -.01em; line-height: 1.35; }
#panel .meta { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 16px; }
#panel .meta b { color: var(--text); font-weight: 500; }
#panel p { margin: 0 0 10px; }
#panel p.comment { color: var(--faint); font-style: italic; font-size: 12.5px; padding-left: 12px; border-left: 2px solid var(--line); }
#panel p.chair { color: var(--muted); font-size: 12.5px; padding-left: 12px; border-left: 2px solid #cfd8ea; }
#panel mark { background: #fff3a8; color: inherit; border-radius: 2px; }
#panel h3 { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 20px 0 8px; }
#panel table { border-collapse: collapse; width: 100%; font-size: 13px; }
#panel td { padding: 4px 0; vertical-align: top; }
#panel td:last-child { text-align: right; color: var(--muted); white-space: nowrap; padding-left: 10px; }
#panel ul { padding-left: 0; margin: 0; list-style: none; }
#panel li { margin-bottom: 6px; }
#panel li .sub { color: var(--faint); font-size: 12px; }
.bar { height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 5px; }
.bar i { display: block; height: 100%; }
.similar { padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; margin-bottom: 6px; transition: border-color .12s, background .12s; }
.similar:hover { border-color: #cdcdc8; background: var(--bg); }
.similar .who { font-weight: 500; }
.similar .who span { color: var(--faint); font-weight: 400; }
.similar .what { color: var(--muted); font-size: 12px; }
.similar .kind { font-size: 10.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.similar.marker { margin: 4px 0 12px; }
.similar .full { display: none; margin-top: 6px; }
.similar.open .full { display: block; }
.similar.open .what { display: none; }
#panel .similar .full p { font-size: 12.5px; margin: 0 0 6px; }
#panel table.dist tr { cursor: pointer; }
#panel table.dist tr:hover td:first-child { color: var(--accent); }
#panel details summary { color: var(--muted); font-size: 12px; cursor: pointer; margin: 2px 0 4px; }
.whohead { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.whohead h2 { margin: 0 !important; }
.whohead h2 a { color: inherit; }
.whohead h2 a:hover { color: var(--accent); text-decoration: none; }
.whohead .ext { display: block; font-size: 12px; font-weight: 400; color: var(--muted); letter-spacing: 0; }
.avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; object-position: 50% 20%; flex: none; background: var(--line); }
.votes { display: flex; flex-direction: column; gap: 5px; margin: -6px 0 16px; }
.vote, a.vote.ev { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; color: var(--text); line-height: 1.4; }
.vote:hover { text-decoration: none; } .vote:hover .subj { color: var(--research); }
.res { flex: none; font-size: 10.5px; font-weight: 600; border-radius: 999px; padding: 1px 7px; background: var(--bg); color: var(--muted); }
.res.angenommen { background: #e3f3e3; color: #2f6f2f; } .res.abgelehnt { background: #fde8e8; color: #a8231a; }
.vote .how { color: var(--faint); font-size: 11.5px; white-space: nowrap; }
.close { float: right; color: var(--faint); background: none; border: 0; font-size: 18px; line-height: 1; cursor: pointer; margin: -4px -6px 0 0; }
.close:hover { color: var(--text); }

/* desktop: the sheet is only a wrapper, its children sit in the three grid columns */
#sheet { display: contents; }
#sheetHead { display: none; }
aside { grid-area: 1 / 1; } #map { grid-area: 1 / 2; } #panel { grid-area: 1 / 3; }
@media (hover: none) {
  .item:hover, .similar:hover { background: none; } .item:hover .name { color: inherit; } .lbl:hover { transform: translate(-50%, -50%); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
}

/* phones: map on top, a bottom sheet with the tabs Filter | Details; heights are set in JS (layoutSheet) */
@media (max-width: 900px), (pointer: coarse) and (max-width: 1100px) {
  html, body { overflow: hidden; overscroll-behavior: none; }
  header { height: 48px; padding: 0 12px; gap: 10px; position: relative; z-index: 12; }
  header .meta, header .help, header .brand .logo, header .brand .wm { display: none; }
  header .brand + h1 { padding-left: 10px; }
  header h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #weekCal { position: fixed; left: 8px; right: 8px; top: 52px; flex-direction: column; max-height: calc(100dvh - 70px); overflow-y: auto; }
  #weekCal .wk { width: 32px; height: 32px; line-height: 32px; font-size: 12px; }
  #weekCal .mo span { width: 34px; }
  #tourMenu { position: fixed; left: 8px; right: 8px; top: 52px; width: auto; }
  #tourMenu .t { padding: 12px; }
  #layout { display: block; height: auto; }
  #map, #map.tour-target, #map.tour-keep { position: fixed; top: 48px; left: 0; right: 0; height: 50dvh; touch-action: none; }
  #dayScale { flex-wrap: wrap; justify-content: center; gap: 4px 12px; max-width: calc(100% - 16px); border-radius: 12px; bottom: 8px; }
  .lbl { padding: 5px 11px 5px 9px; }
  #sheet { display: flex; flex-direction: column; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; height: 50dvh;
    background: var(--card); border-radius: 16px 16px 0 0; box-shadow: 0 -4px 20px rgba(0,0,0,.08), 0 -1px 0 var(--line); transition: height .25s ease; }
  #sheet.dragging { transition: none; }
  body.tour-sheet #sheet { z-index: 21; }
  #sheetHead { display: block; flex: none; touch-action: none; }
  .grip { height: 22px; display: flex; align-items: center; justify-content: center; }
  .grip::before { content: ''; width: 38px; height: 4px; border-radius: 2px; background: #d4d4d0; }
  #peek { margin: 0 12px 8px; padding: 9px 12px 8px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.05); }
  #peek[hidden] { display: none; }
  #peek .who .go { margin-left: auto; color: var(--accent); font-weight: 500; white-space: nowrap; }
  #peek .excerpt { -webkit-line-clamp: 2; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin: 0 12px 8px; background: var(--bg); border-radius: 10px; padding: 3px; }
  .tabs button { border: 0; background: transparent; border-radius: 8px; padding: 7px; font-size: 14px; color: var(--muted); }
  body[data-tab=filter] .tabs [data-tab=filter], body[data-tab=detail] .tabs [data-tab=detail] { background: var(--card); color: var(--text); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  #filterBadge:not(:empty) { font-size: 11px; font-weight: 500; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 0 6px; margin-left: 4px; }
  aside, #panel { flex: 1; min-height: 0; border: 0 !important; overscroll-behavior: contain; padding-bottom: calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line) !important; }
  aside { padding-top: 10px; }
  #panel { padding-top: 16px; font-size: 14.5px; }
  body[data-tab=filter] #panel, body[data-tab=detail] aside { display: none; }
  .list { max-height: none; }
  .item { min-height: 40px; font-size: 14px; }
  .item input { width: 18px; height: 18px; }
  .item .n { font-size: 12px; }
  .group .title { padding: 9px 0; font-size: 12px; }
  .group .title .reload { font-size: 18px; padding: 0 12px; margin: -6px 0; }
  .segmented button { padding: 9px 2px; font-size: 13px; }
  .toggle { padding: 9px 0; font-size: 14px; }
  .toggle input { width: 38px; height: 22px; } .toggle input::after { width: 18px; height: 18px; } .toggle input:checked::after { left: 18px; }
  select, input[type=text] { font-size: 16px; padding: 8px 10px; }  /* under 16px iOS zooms into the field */
  .searchrow button { padding: 0 16px; font-size: 18px; }
  .similar { padding: 10px 12px; }
  #panel table.dist td { padding: 7px 0; }
  #panel details summary { padding: 8px 0; font-size: 13px; }
  .close { font-size: 26px; padding: 4px 10px; margin: -10px -14px 0 0; }
  #tourCard { width: auto; right: 8px; }
  /* landscape phones: the sheet is a fixed right-hand column, no dragging */
  @media (orientation: landscape) and (max-height: 500px) {
    #map, #map.tour-target, #map.tour-keep { right: 42%; height: auto !important; bottom: 0; }
    #sheet { top: 48px; left: auto; width: 42%; height: auto !important; border-radius: 0; box-shadow: -1px 0 0 var(--line); }
    .grip { display: none; }
    #sheetHead { padding-top: 8px; }
  }
}
</style>
</head>
<body class="mode-radar">
<header class="m-radar">
  __BRAND__
  <h1><a href="index.html">Themenlandschaft</a></h1>
  <span class="weekwrap"><button class="weekbtn" id="weekBtn" title="Sitzungswoche wählen"></button><div id="weekCal"></div></span>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <span class="help">Scrollen: Zoom · Ziehen: Verschieben · Doppelklick: Zurücksetzen</span>
  <button class="tourbtn" id="tourBtn">Tour</button>
  <div id="tourMenu"></div>
</header>
<div id="tourDim"></div><div id="tourCard"></div>
<div id="layout">
  <div id="sheet">
  <div id="sheetHead"><div class="grip" title="Größe ändern"></div><div id="peek" class="tipbox" hidden></div>
    <div class="tabs"><button data-tab="filter">Filter <span id="filterBadge"></span></button><button data-tab="detail">Details</button></div></div>
  <aside>
    <div class="sidebar-head"><b>Filter</b><span><span id="count"></span> · <button class="linkbtn" id="reset">zurücksetzen</button></span></div>
    <div class="group" id="g-search"><div class="title">Suche<span class="arrow"></span></div><div class="content">
      <div class="searchrow"><input type="text" id="search" placeholder="Text, Name, Tagesordnungspunkt…"><button id="addSearch" title="Suchbegriff als Filter speichern (Enter)">+</button></div>
      <div class="list" id="searchList"></div>
    </div></div>
    <div class="group collapsed" id="g-fraction"><div class="title">Fraktion<span class="arrow"></span></div><div class="content"><div class="list" data-key="fraction"></div><p class="fnote">Reden in einem Regierungsamt zählen für die Bundesregierung, nicht für die Fraktion der Rednerin oder des Redners.</p></div></div>
    <div class="group collapsed" id="g-agenda"><div class="title">Tagesordnung<span class="reload" data-key="agenda" title="Nach Häufigkeit in der aktuellen Ansicht sortieren">↻</span><span class="arrow"></span></div><div class="content"><div class="list" data-key="agenda"></div></div></div>
    <div class="group collapsed" id="g-cluster"><div class="title">Thema<span class="reload" data-key="cluster" title="Nach Häufigkeit in der aktuellen Ansicht sortieren">↻</span><span class="arrow"></span></div><div class="content"><div class="list" data-key="cluster"></div></div></div>
    <div class="group collapsed" id="g-speaker"><div class="title">Redner:in<span class="reload" data-key="speaker" title="Nach Häufigkeit in der aktuellen Ansicht sortieren">↻</span><span class="arrow"></span></div><div class="content"><div class="list" data-key="speaker"></div></div></div>
    <div class="group" id="g-view"><div class="title">Anzeige<span class="arrow"></span></div><div class="content">
      <div class="segmented" id="color">
        <button data-mode="cluster" class="on">Thema</button><button data-mode="fraction">Fraktion</button><button data-mode="weekday">Tag</button><button data-mode="agenda">TOP</button><button data-mode="mdb">Rolle</button>
      </div>
      <label class="toggle">Gefilterte abdunkeln statt ausblenden <input type="checkbox" id="dim"></label>
      <label class="toggle">Regierungsbefragung zeigen <input type="checkbox" id="befragung"></label>
      <label class="toggle">Zwischenfragen zeigen <input type="checkbox" id="zwischenfragen"></label>
      <label class="toggle">Größe nach Redelänge <input type="checkbox" id="size"></label>
      <label class="toggle">Themen-Labels <input type="checkbox" id="showLabels"></label>
    </div></div>
    __METHOD__
  </aside>
  <div id="panel"></div>
  </div>
  <div id="map"><div id="labels"></div><div id="tip" class="tipbox"></div><div id="dayScale"></div></div>
</div>
<script>
const DATA = __DATA__;
const S = DATA.speeches;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const mq = matchMedia('(max-width: 900px), (pointer: coarse) and (max-width: 1100px)');  // the phone layout, as in the CSS
let mobile = mq.matches;
const FRACTION_COLORS = { 'CDU/CSU': css('--cdu'), 'SPD': css('--spd'), 'AfD': css('--afd'), 'BÜNDNIS 90/DIE GRÜNEN': css('--gru'), 'Die Linke': css('--lin'), 'fraktionslos': css('--frl'), 'Bundesregierung': css('--reg'), 'Sonstige': css('--frl') };
const ROLE_COLORS = ['#2a78d6', '#eb6834'];  // Abgeordnete, Regierung
const NOISE = '#d4d4d0';
const FRACTION_ORDER = Object.keys(FRACTION_COLORS);
const DAY_ORDER = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const weekdayOf = d => DAY_ORDER[(new Date(d).getUTCDay() + 6) % 7];
const clusterById = Object.fromEntries(DATA.clusters.map(c => [c.id, c]));
const median = a => { const b = [...a].sort((x, y) => x - y); return b[b.length >> 1]; };
const hsv = (h, s, v) => { const f = n => { const k = (n + h * 6) % 6; return Math.round(255 * v * (1 - s * Math.max(0, Math.min(k, 4 - k, 1)))); }; return `rgb(${f(5)},${f(3)},${f(1)})`; };
const CLUSTER_COLOR = (() => {  // evenly spaced vivid hues, ordered by each cluster's angle around the map centre so the map reads like a colour wheel
  const cx = median(S.map(s => s.x)), cy = median(S.map(s => s.y));
  const angle = c => { const g = S.filter(s => s.cluster === c.id); return Math.atan2(median(g.map(s => s.y)) - cy, median(g.map(s => s.x)) - cx); };
  const ordered = DATA.clusters.map(c => [c.id, angle(c)]).sort((a, b) => a[1] - b[1]);
  return Object.fromEntries(ordered.map(([id], i) => [id, hsv(i / ordered.length, .75, .92)]));
})();
const ACRONYMS = new Set(['usa', 'nato', 'eu', 'uno', 'un', 'csd', 'ard', 'zdf', 'kfw', 'dfb', 'fifa', 'ki', 'eeg', 'geg', 'stpo', 'bgb', 'sgb', 'bka', 'bnd', 'öpnv', 'lng', 'co2', 'nis', 'tv', 'gkv', 'pkv', 'iwf', 'oecd', 'wto']);
const cap = w => ACRONYMS.has(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1);
const clusterLabel = (c, n = 3) => c < 0 ? 'ohne Thema' : clusterById[c].terms.slice(0, n).map(cap).join(' · ');
const excerpt = s => { const t = s.paragraphs.find(p => p[0] === 'text'); return t ? t[1].slice(0, 140) + '…' : ''; };
const byId = Object.fromEntries(S.map(s => [s.id, s]));
// a speech id from a link: a point, a Kurzintervention too short to be one (→ the speech it interrupted),
// or a continuation part of a split speech (ID…-3 → ID…)
const resolveSpeech = id => {
  if (!id || byId[id]) return id;
  const host = S.find(s => s.paragraphs.some(([k, t]) => (k === 'zwischenfrage' || k === 'kurzintervention') && t === id));
  if (host) return host.id;
  const base = id.replace(/-\d+$/, '');
  return byId[base] ? base : '';
};
// links out to the MdB cards site: speaker cards, portraits, sitting pages, vote pages
const RESEARCH = __RESEARCH__;
const cardUrl = pid => `${RESEARCH}${encodeURIComponent(pid)}.html`;
const sittingUrl = aid => { const [wp, n, pos] = (aid || '').split('/'); return pos ? `${RESEARCH}sitzungen/${wp}-${n}.html#top-${pos}` : ''; };
const fmt = d => d.slice(8, 10) + '.' + d.slice(5, 7) + '.' + d.slice(0, 4);
S.forEach(s => {
  s.weekday = weekdayOf(s.date);
  s.befragung = !!s.befragung;  // the foundation's agenda_item.kind
  s.zwischenfrage = !!s.zwischenfrage;  // another person's question inside a speech; readable from that speech's card
  s.text = s.paragraphs.filter(p => p[0] === 'text').map(p => p[1]).join('\n');
  s.haystack = `${s.speaker}\n${s.role || ''}\n${s.agenda}\n${s.text}`.toLowerCase();
});
const AGENDA = [...Map.groupBy(S, s => s.agenda_id).values()].map(v => v[0]).sort((a, b) => a.agenda_id.localeCompare(b.agenda_id, 'de', {numeric: true}));
const AGENDA_BY = Object.fromEntries(AGENDA.map(a => [a.agenda_id, a]));
const dates = [...new Set(S.map(s => s.date))].sort();
const DAY_HUES = [.585, .07, .36, .74];  // blue, orange, green, purple: the hues of the day scales below
const AGENDA_COLOR = Object.fromEntries([...Map.groupBy(AGENDA, a => a.date)].flatMap(([d, items]) => {
  const h = DAY_HUES[dates.indexOf(d) % DAY_HUES.length];  // AGENDA holds each item's first speech, so S order = speaking order
  return items.sort((a, b) => S.indexOf(a) - S.indexOf(b)).map((a, j) => {
    const t = items.length > 1 ? j / (items.length - 1) : .5;
    return [a.agenda_id, hsv((h + (t - .5) * .12 + 1) % 1, .4 + .5 * t, .95 - .27 * t)];
  });
}));
const DAY_DATE = Object.fromEntries(dates.map(d => [weekdayOf(d), d]));
document.getElementById('meta').textContent = `${fmt(dates[0])} – ${fmt(dates[dates.length - 1])} · ${S.length} Reden · ${DATA.clusters.length} Themen`;
document.title = `Themenlandschaft ${DATA.week}`;

// day colouring: one sequential scale per sitting day (blue, orange, green, purple), light = early, dark = late
const SCALES = [['#c6dbef', '#9ecae1', '#6baed6', '#4292c6', '#2171b5', '#08519c', '#08306b'], ['#fdd0a2', '#fdae6b', '#fd8d3c', '#f16913', '#d94801', '#a63603', '#7f2704'],
  ['#c7e9c0', '#a1d99b', '#74c476', '#41ab5d', '#238b45', '#006d2c', '#00441b'], ['#dadaeb', '#bcbddc', '#9e9ac8', '#807dba', '#6a51a3', '#54278f', '#3f007d']];
const heat = (day, t) => {
  const sc = SCALES[day % SCALES.length], p = Math.min(Math.max(t, 0), 1) * (sc.length - 1), i = Math.floor(p), f = p - i;
  const rgb = h => [1, 3, 5].map(k => parseInt(h.slice(k, k + 2), 16)), a = rgb(sc[i]), b = rgb(sc[Math.min(i + 1, sc.length - 1)]);
  return `rgb(${a.map((c, k) => Math.round(c + (b[k] - c) * f)).join(',')})`;
};
Map.groupBy(S, s => s.date).forEach((g, d) => g.forEach((s, r) => s.dayColor = heat(dates.indexOf(d), (r + .5) / g.length)));  // payload order = speaking order
const dayGradient = v => `linear-gradient(90deg, ${heat(dates.indexOf(DAY_DATE[v]), 0)}, ${heat(dates.indexOf(DAY_DATE[v]), 1)})`;

// week picker: a calendar of both years, sitting weeks as links
const weekBtn = document.getElementById('weekBtn'), weekCal = document.getElementById('weekCal'), weekSet = new Set(DATA.weeks);
const [YEAR, KW] = DATA.week.split('-W').map(Number);
weekBtn.textContent = `KW ${KW} · ${YEAR}`;
const MONTHS = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const shift = (d, n) => { const r = new Date(d); r.setUTCDate(d.getUTCDate() + n); return r; };
const dm = d => `${d.getUTCDate()}.${d.getUTCMonth() + 1}.`;
weekCal.innerHTML = [...new Set(DATA.weeks.map(w => w.slice(0, 4)))].map(y => {
  const rows = MONTHS.map(() => []), jan4 = new Date(Date.UTC(y, 0, 4)), week1 = shift(jan4, -(jan4.getUTCDay() + 6) % 7);
  for (let w = 1; w <= 53; w++) {
    const mon = shift(week1, 7 * (w - 1)), thu = shift(mon, 3);  // an ISO week belongs to the year and month of its Thursday
    if (thu.getUTCFullYear() !== +y) continue;
    const id = `${y}-W${String(w).padStart(2, '0')}`, has = weekSet.has(id);
    rows[thu.getUTCMonth()].push(`<a class="wk${has ? ' has' : ''}${id === DATA.week ? ' cur' : ''}"${has ? ` href="${id}.html"` : ''} title="KW ${w} · ${dm(mon)} – ${dm(shift(mon, 6))}">${w}</a>`);
  }
  return `<div><b>${y}</b>${rows.map((r, i) => `<div class="mo"><span>${MONTHS[i]}</span>${r.join('')}</div>`).join('')}</div>`;
}).join('');
weekBtn.onclick = e => { e.stopPropagation(); weekCal.classList.toggle('open'); };

// --- filter groups: value of a speech, display name, colour ---------------------------
const GROUPS = {
  fraction: { of: s => s.fraction, name: v => v, color: v => FRACTION_COLORS[v] || NOISE, order: (a, b) => (FRACTION_ORDER.indexOf(a) + 1 || 99) - (FRACTION_ORDER.indexOf(b) + 1 || 99) },
  weekday: { of: s => s.weekday, name: v => `${v} ${fmt(DAY_DATE[v]).slice(0, 6)}`, color: v => heat(dates.indexOf(DAY_DATE[v]), .6), swatch: dayGradient, order: (a, b) => DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b) },
  agenda: { of: s => s.agenda_id, name: v => AGENDA_BY[v].agenda, color: v => AGENDA_COLOR[v], order: (a, b) => a.localeCompare(b, 'de', {numeric: true}) },
  cluster: { of: s => s.cluster, name: v => v < 0 ? 'ohne Thema' : clusterById[v].terms.join(' · '), color: v => v < 0 ? NOISE : CLUSTER_COLOR[v], order: (a, b) => (a < 0) - (b < 0) || a - b },
  speaker: { of: s => s.speaker, name: v => v, color: v => FRACTION_COLORS[S.find(s => s.speaker === v).fraction] || NOISE, order: null },
};
document.getElementById('dayScale').innerHTML = dates.map(d => `<span><i style="background:${dayGradient(weekdayOf(d))}"></i>${GROUPS.weekday.name(weekdayOf(d))}</span>`).join('') + '<span class="hint">früh → spät</span>';
const DEFAULTS = { mode: 'cluster', terms: [], live: '', dim: true, befragung: false, zwischenfragen: false, size: true, showLabels: true, open: '', peek: '' };
const TOGGLES = ['dim', 'befragung', 'zwischenfragen', 'size', 'showLabels'];
const state = { ...DEFAULTS, checked: Object.fromEntries(Object.keys(GROUPS).map(k => [k, new Set()])) };
const totals = Object.fromEntries(Object.keys(GROUPS).map(k => [k, Map.groupBy(S, GROUPS[k].of)]));
const initialOrder = k => {
  const g = GROUPS[k], vals = [...totals[k].keys()];
  return g.order ? vals.sort(g.order) : vals.sort((a, b) => totals[k].get(b).length - totals[k].get(a).length);
};
const listOrder = Object.fromEntries(Object.keys(GROUPS).map(k => [k, initialOrder(k)]));

// --- URL hash keeps the view shareable ----------------------------------------------
const encodeState = () => {
  const h = new URLSearchParams();
  if (state.mode !== 'cluster') h.set('farbe', state.mode);
  for (const k in GROUPS) if (state.checked[k].size) h.set(k, [...state.checked[k]].join('|'));
  if (state.terms.length) h.set('suche', state.terms.filter(t => t.on).map(t => t.term).join('|'));
  for (const k of TOGGLES) if (state[k] !== DEFAULTS[k]) h.set(k, state[k] ? '1' : '0');
  if (state.open) h.set('rede', state.open);
  history.replaceState(history.state, '', h.size ? '#' + h : location.pathname);  // keeps the sheet's back-button entries
};
let startTourId = '';
const decodeState = () => {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('farbe')) state.mode = h.get('farbe');
  for (const k in GROUPS) (h.get(k) || '').split('|').filter(Boolean).forEach(v => state.checked[k].add(k === 'cluster' ? +v : v));
  state.terms = (h.get('suche') || '').split('|').filter(Boolean).map(term => ({ term, on: true }));
  for (const k of TOGGLES) if (h.has(k)) state[k] = h.get(k) === '1';
  state.open = resolveSpeech(h.get('rede') || h.get('open') || '');  // #open= is the key the cards site links with
  startTourId = h.get('tour') || '';
};
decodeState();

// --- sidebar --------------------------------------------------------------------------
const listEls = Object.fromEntries([...document.querySelectorAll('.list[data-key]')].map(el => [el.dataset.key, el]));
const items = k => document.querySelectorAll(`.item[data-key=${k}]`);
const row = (k, v, cls = '') => { const g = GROUPS[k]; return `<div class="item${cls}" data-key="${k}" data-i="${listOrder[k].indexOf(v)}" title="${esc(g.name(v))} – Häkchen filtert, Klick zeigt die Übersicht"><input type="checkbox"${state.checked[k].has(v) ? ' checked' : ''}><span class="dot" style="background:${(g.swatch || g.color)(v)}"></span><span class="name">${esc(g.name(v))}</span><span class="n"></span></div>`; };
function renderList(k) {
  if (k === 'weekday') k = 'agenda';  // days and their agenda items share one list
  listEls[k].innerHTML = k === 'agenda'
    ? listOrder.weekday.map(d => row('weekday', d, ' day') + listOrder.agenda.filter(a => AGENDA_BY[a].weekday === d).map(a => row('agenda', a)).join('')).join('')
    : listOrder[k].map(v => row(k, v)).join('');
  listEls[k].querySelectorAll('.item').forEach(it => {
    const k = it.dataset.key, v = listOrder[k][+it.dataset.i], input = it.querySelector('input');
    input.onchange = () => { input.checked ? state.checked[k].add(v) : state.checked[k].delete(v); draw(); };
    it.onclick = e => { if (e.target === input) return; if (nearBox(e, it)) input.click(); else showCard(k, v); };
  });
}
const nearBox = (e, it) => mobile && e.clientX - it.getBoundingClientRect().left < 40;
Object.keys(listEls).forEach(renderList);
function renderSearchList() {
  const el = document.getElementById('searchList');
  el.innerHTML = state.terms.map((t, i) =>
    `<div class="item" data-i="${i}"><input type="checkbox"${t.on ? ' checked' : ''}><span class="name">„${esc(t.term)}“</span><span class="n"></span><span class="x" title="Entfernen">×</span></div>`).join('');
  el.querySelectorAll('.item').forEach(it => {
    const i = +it.dataset.i, input = it.querySelector('input');
    input.onchange = () => { state.terms[i].on = input.checked; draw(); };
    it.querySelector('.x').onclick = () => { state.terms.splice(i, 1); renderSearchList(); draw(); };
    it.onclick = e => { if (e.target !== input && nearBox(e, it)) return input.click(); if (e.target !== input && !e.target.classList.contains('x')) { const term = state.terms[i].term; showGroup(S.filter(s => s.haystack.includes(term.toLowerCase())), `„${term}“`, 'Suchbegriff'); } };
  });
}
renderSearchList();
const searchInput = document.getElementById('search');
let typing;
searchInput.oninput = () => { state.live = searchInput.value.trim().toLowerCase(); clearTimeout(typing); typing = setTimeout(draw, 120); };
const addSearch = () => {
  const term = searchInput.value.trim();
  if (term.length > 1 && !state.terms.some(t => t.term.toLowerCase() === term.toLowerCase())) state.terms.push({ term, on: true });
  searchInput.value = ''; state.live = ''; renderSearchList(); draw();
};
searchInput.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); addSearch(); } };
document.getElementById('addSearch').onclick = addSearch;
document.querySelectorAll('.group .title').forEach(t => t.onclick = e => { if (!e.target.classList.contains('reload')) t.parentElement.classList.toggle('collapsed'); });
document.querySelectorAll('.reload').forEach(r => r.onclick = () => {
  const k = r.dataset.key, counts = Map.groupBy(S.filter(matches), GROUPS[k].of);
  listOrder[k].sort((a, b) => (counts.get(b) || []).length - (counts.get(a) || []).length);
  flags.reloaded[k] = true;
  renderList(k); draw();
});
document.querySelectorAll('#color button').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; draw(); });
TOGGLES.forEach(id => document.getElementById(id).onchange = e => { state[id] = e.target.checked; draw(); });
// reset: every filter, toggle, list order and the zoom back to how the page opens
let view = 0;  // Plotly keeps zoom/pan while uirevision stays the same; a new value re-fits the map
document.getElementById('reset').onclick = () => {
  for (const k in GROUPS) { state.checked[k].clear(); listOrder[k] = initialOrder(k); }
  Object.assign(state, DEFAULTS, { terms: [] });
  flags.reloaded = {}; clearTimeout(typing); searchInput.value = ''; view++; mapRange = null;
  Object.keys(listEls).forEach(renderList); renderSearchList(); if (state.open) closeSpeech(); showHint(); renderPeek(); draw();
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.activeElement !== searchInput && state.open) closeSpeech(); });
const setOnly = (k, v) => { state.checked[k] = new Set([v]); renderList(k); draw(); };  // filter to one value
const setSpeaker = name => { setOnly('speaker', name); showCard('speaker', name); };
const setCluster = id => { setOnly('cluster', id); if (id >= 0) showCluster(id); };

function syncControls() {
  document.querySelectorAll('#color button').forEach(x => x.classList.toggle('on', x.dataset.mode === state.mode));
  TOGGLES.forEach(id => document.getElementById(id).checked = state[id]);
  document.querySelectorAll('.group .badge').forEach(b => b.remove());
  for (const k in GROUPS) {
    const n = state.checked[k].size, title = document.querySelector(`#g-${k === 'weekday' ? 'agenda' : k} .title`), badge = title.querySelector('.badge');
    if (!n) continue;
    if (badge) badge.textContent = +badge.textContent + n; else title.querySelector('.arrow').insertAdjacentHTML('beforebegin', `<span class="badge">${n}</span>`);
  }
  const active = Object.values(state.checked).reduce((a, c) => a + c.size, 0) + state.terms.filter(x => x.on).length;
  document.getElementById('filterBadge').textContent = active || '';
}

// empty group = no filter; OR within a group, AND across groups; every active search term has to match
// days and agenda items form one group in the sidebar, so a ticked day and a ticked item of another day are OR-ed too
const dayOrItem = s => !(state.checked.weekday.size || state.checked.agenda.size) || state.checked.weekday.has(s.weekday) || state.checked.agenda.has(s.agenda_id);
const matches = s => ['fraction', 'cluster', 'speaker'].every(k => !state.checked[k].size || state.checked[k].has(GROUPS[k].of(s))) && dayOrItem(s)
  && state.terms.every(t => !t.on || s.haystack.includes(t.term.toLowerCase()))
  && (state.befragung || state.checked.speaker.size || state.checked.agenda.size || !s.befragung)  // an explicit speaker/TOP filter overrides the Befragung hide

const keyOf = { cluster: s => s.cluster, fraction: s => s.fraction, weekday: s => s.weekday, agenda: s => s.agenda_id, mdb: s => s.role ? 'Regierung' : 'Abgeordnete' };

  const groups = Map.groupBy(drawn, keyOf[mode]);

    paper_bgcolor: css('--bg'), plot_bgcolor: css('--bg'), font: { color: css('--muted'), family: FONT, size: 12 },
    margin: { l: 16, r: 16, t: 16, b: 16 }, hovermode: 'closest',

  document.getElementById('dayScale').style.display = mode === 'weekday' ? 'flex' : 'none';
  tourCheck();

const labelLayer = document.getElementById('labels');
function placeLabels() {
  const fl = map._fullLayout;

  const xa = fl.xaxis, ya = fl.yaxis, W = map.clientWidth, H = map.clientHeight;
  const zoom = SPAN / (xa.range[1] - xa.range[0]);  // 1 ≈ the whole week in view
  const terms = zoom > 2 ? 4 : 3, zoomed = zoom > 1.6;
  const px = a => ({ x: xa.l2p(a.x) + fl._size.l, y: ya.l2p(a.y) + fl._size.t });
  const items = labelAnchors.map(a => ({ ...a, ...px(a) })).filter(a => a.x > 0 && a.x < W && a.y > 0 && a.y < H).sort((a, b) => b.n - a.n);
  const colour = id => state.mode === 'cluster' ? GROUPS.cluster.color(id) : '#b4b4b0';  // labels carry the topic colour only when points do
  labelLayer.innerHTML = items.map(a => `<div class="lbl${zoomed ? ' zoomed' : ''}" data-c="${a.id}" style="left:${a.x}px;top:${a.y}px;color:${colour(a.id)}">${dot(colour(a.id))}<span style="color:#374151">${esc(clusterLabel(a.id, terms))}</span><span class="n">${a.n}</span></div>`).join('');

  const placed = [];

      if (yy > h / 2 && yy < H - h / 2 && !placed.some(r => Math.abs(r.x - x) < (r.w + w) / 2 && Math.abs(r.y - yy) < (r.h + h) / 2)) { y = yy; ok = true; break; }
    }
    if (!ok) { el.remove(); return; }
    el.style.top = y + 'px'; placed.push({ x, y, w, h });

}

const topLink = s => { const u = sittingUrl(s.agenda_id); return u ? `<a class="ev" href="${u}" target="_blank" rel="noopener" title="Sitzung mit Tagesordnung und Abstimmungen">${esc(s.top)} ↗</a>` : esc(s.top); };
const RESULT_TEXT = { angenommen: 'angenommen', abgelehnt: 'abgelehnt' };
const decisionsHtml = aid => {  // announced results of the agenda item, each linking to its vote page
  const ds = (DATA.decisions || {})[aid] || [];
  return ds.length ? `<div class="votes">${ds.map(d => `<a class="vote ev" href="${RESEARCH}${d.page}" target="_blank" rel="noopener"><span class="res ${d.result || ''}">${RESULT_TEXT[d.result] || 'Beschluss'}</span><span class="subj">${esc(cut(d.subject || 'Abstimmung', 110))}</span><span class="how">${d.kind === 'namentlich' ? 'namentlich' : 'Handzeichen'} ↗</span></a>`).join('')}</div>` : '';
};

// another person taking the floor inside a speech. A Zwischenfrage is always shown in place, in full (every one is
// also a point of its own, hidden on the map unless „Zwischenfragen zeigen“); a Kurzintervention that is a point is
// a card that opens it, one too short to be a point expands in place; „Antwort“ leads from a Zwischenfrage back.
const MARKERS = { zwischenfrage: 'Zwischenfrage', kurzintervention: 'Kurzintervention', antwort: 'Antwort in der Rede' };
function markerCard(kind, id, s) {
  const o = byId[id] || DATA.linked[id];
  if (!o) return '';
  let what = firstText(o);
  if (kind === 'antwort') {  // the main speech from where it answers this one
    const i = o.paragraphs.findIndex(([k, t]) => k in MARKERS && t === s.id);
    what = (o.paragraphs.slice(i + 1).find(p => p[0] === 'text') || ['', what])[1];
  }
  const head = `<div class="kind">${MARKERS[kind]}</div>`;
  const inPlace = kind === 'zwischenfrage';
  if (byId[id] && !inPlace) return speechCard(o, esc(cut(what, 180)), head).replace('class="similar"', 'class="similar marker"');
  const full = o.paragraphs.filter(([k]) => !(k in MARKERS)).map(([k, t]) => `<p class="${k}">${k === 'text' ? highlight(t) : esc(t)}</p>`).join('');
  const point = byId[id] ? ` · <a href="#" data-open="${o.id}" title="Die Zwischenfrage als eigenen Punkt auf der Karte öffnen">als Punkt öffnen</a>` : '';
  return `<div class="similar marker${inPlace ? ' open' : ''}" data-aside>${head}<div class="who">${dot(GROUPS.fraction.color(o.fraction))} ${esc(o.speaker)} <span>· ${esc(o.fraction)}${point}</span></div><div class="what">${esc(cut(what, 180))}</div><div class="full">${full}</div></div>`;
}

function showHint() {
  panelKind = 'hint'; lastCard = showHint;
  panel.innerHTML = mobile ? `<p class="hint">Jeder Punkt ist eine Rede der Sitzungswoche; nahe Punkte handeln von Ähnlichem. Die Beschriftungen sind die Themen, die sich aus den Reden ergeben.</p>
    <p class="hint">Einen Punkt antippen zeigt eine Vorschau, ein zweites Tippen öffnet die Rede. Am Griff lässt sich das Blatt hoch- und herunterziehen. Ein Finger verschiebt die Karte, zwei Finger zoomen, doppelt auf eine leere Stelle tippen setzt zurück. Ein Label antippen: wer spricht zu diesem Thema.</p>
    <p class="hint">Unter „Filter“: der linke Rand einer Zeile setzt das Häkchen, der Name zeigt die Übersicht. Innerhalb einer Gruppe „oder“, zwischen Gruppen „und“; nichts angehakt heißt alles.</p>` : `<p class="hint">Jeder Punkt ist eine Rede der Sitzungswoche; nahe Punkte handeln von Ähnlichem. Die Beschriftungen sind die Themen, die sich aus den Reden ergeben.</p>
    <p class="hint">Filter links: das Häkchen filtert, ein Klick auf den Namen zeigt die Übersicht. Innerhalb einer Gruppe „oder“, zwischen Gruppen „und“; nichts angehakt heißt alles. Suchbegriffe markieren Treffer, <kbd>Enter</kbd> macht sie zum Filter.<br>Punkt anklicken: die Rede mit Zwischenrufen, Zwischenfragen, Quelle, der nächsten und ähnlichen Reden. Label anklicken: wer spricht zu diesem Thema. <kbd>Esc</kbd> schließt.</p>`;
}
function showSpeech(s) {
  panelKind = 'speech';
  state.open = s.id;
  if (s.befragung) state.befragung = true;
  if (s.zwischenfrage) state.zwischenfragen = true;
  if (mobile) {  // the speech takes the sheet's Details tab; the back button closes it again
    state.peek = ''; renderPeek();
    if (!levels.includes('speech')) pushLevel('speech');
    setSheet({ tab: 'detail', snap: sheetSnap === 'full' ? 'full' : 'half' }).then(() => reveal(s));
  }
  const paras = s.paragraphs.map(([k, t]) => k in MARKERS ? markerCard(k, t, s) : `<p class="${k}">${k === 'text' ? highlight(t) : esc(t)}</p>`).join('');
  const next = byId[s.next];
  panel.innerHTML = `
    <button class="close" onclick="closeSpeech()" title="Schließen (Esc)">×</button>
    ${whoHead(s.speaker, s)}
    <div class="meta"><b>${esc(s.fraction)}</b>${s.role ? ' · ' + esc(s.role) : ''} · <a href="#" onclick="setSpeaker(${esc(JSON.stringify(s.speaker))});return false">alle Reden der Woche</a>${s.zwischenfrage ? ' · Zwischenfrage' : ''}<br>
      ${s.weekday} ${fmt(s.date)} · ${topLink(s)}<br>${dot(AGENDA_COLOR[s.agenda_id])} ${esc(s.agenda)}<br>
      Thema: <a href="#" onclick="setCluster(${s.cluster});return false">${esc(clusterLabel(s.cluster))}</a> · ${s.chars.toLocaleString('de')} Zeichen · ${s.comments} Zwischenrufe/Beifall<br>
      <a href="${s.pdf}" target="_blank" rel="noopener">${esc(s.cite)} (PDF)</a> · Rede ${s.id}${s.drucksachen.length ? ' · Drs. ' + s.drucksachen.join(', ') : ''}</div>
    ${decisionsHtml(s.agenda_id)}
    ${paras}
    ${next ? `<h3>Nächste Rede</h3>${speechCard(next, esc(next.agenda.slice(0, 80)))}` : ''}
    <h3>Ähnliche Reden</h3>${s.similar.map(id => speechCard(byId[id], esc(byId[id].agenda.slice(0, 80)))).join('')}`;
  panel.scrollTop = 0;
  tourCheck();
}
// closing a speech on a phone goes back to the card it was opened from
let lastCard = showHint;
function closeSpeech() { popLevel('speech'); closeSpeechNow(); }
function closeSpeechNow() {
  state.open = '';
  if (!mobile) showHint();
  else { lastCard(); setSheet({ tab: lastCard === showHint ? 'filter' : 'detail', snap: sheetSnap === 'full' ? 'half' : sheetSnap }); }
  draw();
}
const toDetail = () => mobile && setSheet({ tab: 'detail', snap: sheetSnap === 'peek' ? 'half' : sheetSnap });
function showCluster(id) {
  panelKind = 'cluster'; lastCard = () => showCluster(id); toDetail();
  const c = clusterById[id], g = S.filter(s => s.cluster === id);
  panel.innerHTML = `<button class="close" onclick="showHint()" title="Schließen">×</button>
    <h2>${esc(c.terms.join(' · '))}</h2>
    <div class="meta">${g.length} Reden · <a href="#" onclick="setCluster(${id});return false">nur dieses Thema zeigen</a></div>${breakdown(g, 'cluster')}`;
  panel.scrollTop = 0;
  tourCheck();
}
function showGroup(g, title, subtitle, k, v, extra = '') {
  panelKind = 'group'; lastCard = () => showGroup(g, title, subtitle, k, v, extra); toDetail();
  flags.card = { k, v };
  const only = k ? ` · <a href="#" data-only="${k}" data-v="${esc(v)}">nur diese zeigen</a>` : '';
  const list = g.length <= 40 ? `<h3>Reden</h3>${g.map(o => speechCard(o, `${esc(o.agenda.slice(0, 70))}<br>${esc(excerpt(o).slice(0, 110))}`)).join('')}` : '';
  panel.innerHTML = `<button class="close" onclick="showHint()" title="Schließen">×</button>
    ${k === 'speaker' ? whoHead(title, g[0]) : `<h2>${esc(title)}</h2>`}
    <div class="meta">${subtitle ? subtitle + ' · ' : ''}${g.length} Reden · ${g.reduce((a, s) => a + s.chars, 0).toLocaleString('de')} Zeichen · ${g.reduce((a, s) => a + s.comments, 0)} Zwischenrufe/Beifall${only}</div>${extra}${breakdown(g, k)}${list}`;
  panel.scrollTop = 0;
  tourCheck();
}
// the card of one filter value: from a name in the sidebar or a bar in another card
function showCard(k, v) {
  if (k === 'cluster' && v >= 0) return showCluster(v);
  const g = S.filter(s => GROUPS[k].of(s) === v), a = g[0];
  if (k === 'agenda') return showGroup(g, a.agenda, `${a.weekday} ${fmt(a.date)} · ${topLink(a)}`, k, v, decisionsHtml(v));
  if (k === 'weekday') return showGroup(g, `${v} ${fmt(a.date)}`, 'Sitzungstag', k, v);
  const sub = { fraction: 'Fraktion', speaker: `${esc(a.fraction)} · alle Reden dieser Woche`, cluster: 'Reden ohne Thema' }[k];
  showGroup(g, GROUPS[k].name(v), sub, k, v);
}
panel.addEventListener('click', e => {
  const el = e.target.closest('[data-open], [data-aside], [data-card], [data-only]');
  if (!el) return;
  e.preventDefault();
  if (el.dataset.open) { showSpeech(byId[el.dataset.open]); draw(); return; }
  if ('aside' in el.dataset) { el.classList.toggle('open'); return; }
  const k = el.dataset.card || el.dataset.only, v = k === 'cluster' ? +el.dataset.v : el.dataset.v;
  el.dataset.card ? showCard(k, v) : setOnly(k, v);
});
// --- phones: bottom sheet with peek / half / full heights, back button steps back ---------
const sheet = document.getElementById('sheet'), sheetHead = document.getElementById('sheetHead'), peekEl = document.getElementById('peek');
const side = matchMedia('(orientation: landscape) and (max-height: 500px)');  // the sheet is a fixed right-hand column
let sheetSnap = 'half', sheetTab = 'filter', mapSize = '';
const sheetHeights = () => {
  const H = innerHeight - document.querySelector('header').offsetHeight, peek = sheetHead.offsetHeight;
  return { H, peek, half: Math.max(Math.round(H * .5), peek), full: H };
};
function layoutSheet() {
  document.body.dataset.tab = sheetTab; sheet.dataset.snap = sheetSnap;
  if (!mobile || side.matches) sheet.style.height = map.style.height = '';
  else {  // at full the sheet covers the map, which keeps its half-screen size
    const h = sheetHeights();
    sheet.style.height = h[sheetSnap] + 'px';
    map.style.height = Math.max(h.H - (sheetSnap === 'full' ? h.half : h[sheetSnap]), 0) + 'px';
  }
  return resizeMap();
}
function resizeMap() {
  const size = `${map.clientWidth}x${map.clientHeight}`;
  if (!map._fullLayout || size === mapSize) return Promise.resolve();
  mapSize = size;
  return Plotly.Plots.resize(map).then(() => { if (mapRange) mapRange = ranges(); placeLabels(); });
}
const levels = [];  // history entries pushed for 'speech' and 'full', so the back button closes them
let skipPop = 0;
const pushLevel = k => { levels.push(k); history.pushState({ sheet: levels.length }, '', location.href); };
const popLevel = k => {  // closed from the page: drop its entry (and any above it) without acting on the popstate
  const i = levels.lastIndexOf(k);
  if (i < 0) return;
  const n = levels.length - i;
  levels.length = i; skipPop++; history.go(-n);
};
addEventListener('popstate', () => {
  if (skipPop) skipPop--;
  else {
    const k = levels.pop();
    if (k === 'speech' && state.open) closeSpeechNow();
    else if (k === 'full' && sheetSnap === 'full') { sheetSnap = 'half'; layoutSheet(); }
  }
  encodeState();  // going back restored an older URL
});
function setSheet({ tab, snap } = {}) {
  if (!mobile) return Promise.resolve();
  const was = sheetSnap;
  if (tab) sheetTab = tab;
  if (snap) sheetSnap = snap;
  if (sheetSnap === 'full' && was !== 'full') pushLevel('full');
  if (was === 'full' && sheetSnap !== 'full') popLevel('full');
  const done = layoutSheet();
  if (tour.id) setTimeout(() => {  // after the height transition
    const el = document.querySelector('.tour-target');
    if (el?.closest('aside')) el.scrollIntoView({ block: 'center' });
    place(el);
  }, 280);
  return done;
}
function renderPeek() {
  const s = byId[state.peek];
  peekEl.hidden = !s;
  peekEl.innerHTML = s ? tipHtml(s, '<span class="go">Öffnen ›</span>') : '';
  if (mobile) layoutSheet();  // the head got taller or shorter
}
peekEl.onclick = () => { const s = byId[state.peek]; if (s) { showSpeech(s); draw(); } };
sheetHead.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setSheet({ tab: b.dataset.tab, snap: sheetSnap === 'peek' ? 'half' : undefined }));
sheetHead.querySelector('.grip').onclick = () => setSheet({ snap: sheetSnap === 'half' ? 'full' : 'half' });
searchInput.addEventListener('focus', () => setSheet({ snap: 'full' }));  // keeps the field above the keyboard
// dragging: the head always, the content only downwards from its top (as in native sheets); a fling jumps one snap
let drag = null, dragEnd = 0;
sheet.addEventListener('touchstart', e => {
  if (!mobile || side.matches || e.touches.length > 1) return;
  const head = sheetHead.contains(e.target), content = e.target.closest('aside, #panel');
  if (head || (content && content.scrollTop <= 0)) drag = { y0: e.touches[0].clientY, h0: sheet.offsetHeight, head, on: false, trail: [] };
}, { passive: true });
sheet.addEventListener('touchmove', e => {
  if (!drag) return;
  const y = e.touches[0].clientY, dy = y - drag.y0;
  if (!drag.on) {
    if (Math.abs(dy) < 8) return;
    if (!drag.head && dy < 0) { drag = null; return; }  // scrolling the content
    drag.on = true; sheet.classList.add('dragging');
  }
  e.preventDefault();
  const h = sheetHeights();
  sheet.style.height = Math.min(Math.max(drag.h0 - dy, h.peek), h.full) + 'px';
  drag.trail = [...drag.trail.slice(-4), [e.timeStamp, y]];
}, { passive: false });
const endDrag = () => {
  const d = drag; drag = null;
  if (!d || !d.on) return;
  sheet.classList.remove('dragging'); dragEnd = Date.now();
  const h = sheetHeights(), cur = sheet.offsetHeight, order = ['peek', 'half', 'full'], [a, b] = [d.trail[0], d.trail.at(-1)];
  const v = a && b[0] > a[0] ? (b[1] - a[1]) / (b[0] - a[0]) : 0;  // px/ms, positive = down
  const nearest = order.reduce((m, k) => Math.abs(h[k] - cur) < Math.abs(h[m] - cur) ? k : m);
  const snap = v < -.4 ? order.find(k => h[k] > cur + 4) || 'full' : v > .4 ? order.findLast(k => h[k] < cur - 4) || 'peek' : nearest;
  setSheet({ snap });
};
sheet.addEventListener('touchend', endDrag);
sheet.addEventListener('touchcancel', endDrag);
sheet.addEventListener('click', e => { if (Date.now() - dragEnd < 400) { e.stopPropagation(); e.preventDefault(); } }, true);  // no tab switch after a drag

// --- phones: own pan / pinch / tap on the map; Plotly keeps the mouse ---------------------
// Plotly's cartesian plots have no pinch zoom, so touches are caught before they reach it
const ranges = () => ({ x: [...map._fullLayout.xaxis.range], y: [...map._fullLayout.yaxis.range] });
const applyRange = r => { mapRange = r; return Plotly.relayout(map, { 'xaxis.range': r.x, 'yaxis.range': r.y }); };
const resetZoom = () => { mapRange = null; Plotly.relayout(map, { 'xaxis.autorange': true, 'yaxis.autorange': true }); };
const gest = { start: null, frame: 0, next: null, tap: null, lastTap: null };
const centre = ts => ({ x: [...ts].reduce((a, t) => a + t.clientX, 0) / ts.length, y: [...ts].reduce((a, t) => a + t.clientY, 0) / ts.length });
const spread = ts => ts.length < 2 ? 0 : Math.hypot(ts[0].clientX - ts[1].clientX, ts[0].clientY - ts[1].clientY);
function gestureStart(ts) {
  const fl = map._fullLayout, r = map.getBoundingClientRect();
  gest.start = { r: ranges(), c: centre(ts), d: spread(ts), l: r.left + fl._size.l, t: r.top + fl._size.t, w: fl._size.w, h: fl._size.h };
}
function gestureMove(ts) {  // the data point under the start centre stays under the fingers, scaled by the pinch
  const s = gest.start, c = centre(ts), wx = s.r.x[1] - s.r.x[0], wy = s.r.y[1] - s.r.y[0];
  let k = s.d && ts.length > 1 ? s.d / Math.max(spread(ts), 1) : 1;
  k = Math.min(Math.max(k, SPAN / 60 / wx), SPAN * 2 / wx);
  const X = s.r.x[0] + (s.c.x - s.l) / s.w * wx, Y = s.r.y[1] - (s.c.y - s.t) / s.h * wy;
  const x0 = X - (c.x - s.l) / s.w * wx * k, y1 = Y + (c.y - s.t) / s.h * wy * k;
  gest.next = { x: [x0, x0 + wx * k], y: [y1 - wy * k, y1] };
  gest.frame ||= requestAnimationFrame(() => { gest.frame = 0; applyRange(gest.next); });
}
function speechAt(cx, cy) {  // nearest shown speech within a finger's reach, else a dimmed one
  const fl = map._fullLayout, r = map.getBoundingClientRect(), px = cx - r.left - fl._size.l, py = cy - r.top - fl._size.t;
  const near = list => {
    let best = null, bd = 26 ** 2;
    for (const s of list) { const d = (fl.xaxis.l2p(s.x) - px) ** 2 + (fl.yaxis.l2p(s.y) - py) ** 2; if (d < bd) { bd = d; best = s; } }
    return best;
  };
  return near(lastShown) || (state.dim ? near(S) : null);
}
function tapAt({ x, y, target }) {
  const lbl = target.closest?.('.lbl');
  if (lbl) return showCluster(+lbl.dataset.c);
  const s = speechAt(x, y);
  if (s) {  // first tap previews, a second tap opens, a tap on the open speech closes it
    gest.lastTap = null;
    if (s.id === state.open) return closeSpeech();
    if (s.id === state.peek) { showSpeech(s); return draw(); }
    state.peek = s.id; flags.hovered = true; renderPeek(); return draw();
  }
  const last = gest.lastTap;
  gest.lastTap = { x, y, t: Date.now() };
  if (last && gest.lastTap.t - last.t < 350 && Math.hypot(x - last.x, y - last.y) < 30) { gest.lastTap = null; return resetZoom(); }
  if (state.peek) { state.peek = ''; renderPeek(); draw(); }
}
function reveal(s) {  // pan (not zoom) so the opened speech is on screen
  const fl = map._fullLayout;
  if (!fl) return;
  const px = fl.xaxis.l2p(s.x), py = fl.yaxis.l2p(s.y), m = 24;
  if (px > m && px < fl._size.w - m && py > m && py < fl._size.h - m) return;
  const r = ranges(), dx = s.x - (r.x[0] + r.x[1]) / 2, dy = s.y - (r.y[0] + r.y[1]) / 2;
  applyRange({ x: r.x.map(v => v + dx), y: r.y.map(v => v + dy) });
}
const own = e => { e.stopPropagation(); if (e.cancelable) e.preventDefault(); };
map.addEventListener('touchstart', e => {
  own(e);
  weekCal.classList.remove('open'); tourMenu.classList.remove('open');  // no click follows a prevented touch
  if (!map._fullLayout) return;
  gestureStart(e.touches);
  gest.tap = e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY, t: Date.now(), target: e.target } : null;
}, { capture: true, passive: false });
map.addEventListener('touchmove', e => {
  own(e);
  if (!gest.start) return;
  if (gest.tap && Math.hypot(e.touches[0].clientX - gest.tap.x, e.touches[0].clientY - gest.tap.y) < 10) return;
  gest.tap = null;
  gestureMove(e.touches);
}, { capture: true, passive: false });
const touchEnd = e => {
  own(e);
  if (e.touches.length) return gestureStart(e.touches);  // a finger lifted: go on with the rest from here
  gest.start = null;
  if (gest.tap && e.type === 'touchend' && Date.now() - gest.tap.t < 500) tapAt(gest.tap);
  gest.tap = null;
};
map.addEventListener('touchend', touchEnd, { capture: true, passive: false });
map.addEventListener('touchcancel', touchEnd, { capture: true, passive: false });

const onLayoutChange = () => {
  mobile = mq.matches;
  if (panelKind === 'hint') showHint();
  layoutSheet();
};
mq.addEventListener('change', onLayoutChange);
side.addEventListener('change', () => layoutSheet());
addEventListener('resize', () => layoutSheet());
layoutSheet();

const focus = [...state.checked.cluster];  // <week>.html#cluster=<id>, as linked from the overview: open that topic's card
if (byId[state.open]) showSpeech(byId[state.open]); else if (focus.length === 1 && clusterById[focus[0]]) showCluster(focus[0]); else showHint();
draw();
if (TOURS[startTourId]) startTour(startTourId);
map.on('plotly_relayouting', placeLabels);
map.on('plotly_relayout', e => {
  if (e['xaxis.autorange']) mapRange = null; else if ('xaxis.range[0]' in e || 'xaxis.range' in e) mapRange = ranges();  // uirevision alone let a zoom drift on redraw
  placeLabels();
});
map.on('plotly_afterplot', placeLabels);
window.addEventListener('resize', () => setTimeout(placeLabels, 50));
const tip = document.getElementById('tip');
function tipHtml(s, go = '') {
  return `<div class="who">${dot(GROUPS.fraction.color(s.fraction))}${esc(s.speaker)} <span>${esc(s.fraction)}</span>${go}</div>
    <div class="when">${s.weekday} ${fmt(s.date)} · ${esc(s.top)}${s.role ? ' · ' + esc(s.role) : ''}</div>
    <div class="top">${esc(s.agenda.slice(0, 120))}</div>
    <div class="topic">${esc(clusterLabel(s.cluster))}</div>
    <div class="excerpt">${esc(s.text.slice(0, 400))}</div>`;
}
map.on('plotly_hover', e => {
  const s = byId[e.points[0].customdata], ev = e.event, r = map.getBoundingClientRect();
  if (!s || !ev) return;
  tip.innerHTML = tipHtml(s);
  tip.style.display = 'block';
  flags.hovered = true; tourCheck();
  const x = Math.min(Math.max(ev.clientX - r.left, 160), r.width - 160), cy = ev.clientY - r.top;
  const below = cy - 16 < tip.offsetHeight + 8;
  tip.classList.toggle('below', below);
  tip.style.left = x + 'px'; tip.style.top = (below ? cy + 16 : cy - 16) + 'px';
});
map.on('plotly_unhover', () => tip.style.display = 'none');
map.addEventListener('mouseleave', () => tip.style.display = 'none');
map.on('plotly_click', e => {
  const id = e.points[0].customdata;
  if (id === state.open) return closeSpeech();  // second click on the open speech closes it
  showSpeech(byId[id]); draw();
});
